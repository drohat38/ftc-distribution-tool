name: Deploy distribution app to GitHub Pages

# Builds app/ (Vite) and publishes it to GitHub Pages. Runs on GitHub's own
# infrastructure, so it is not affected by any local/sandbox network limits.
#
# One-time setup by the repo owner: Settings ▸ Pages ▸ Build and deployment ▸
# Source = "GitHub Actions". After that, every push to main (or a manual run)
# publishes to https://<owner>.github.io/ftc-distribution-tool/.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "data/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test (matching engine)
        working-directory: app
        run: npm test
      - name: Build
        working-directory: app
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
